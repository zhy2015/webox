services:
  mysql:
    image: mysql:8.4
    container_name: webox-mysql
    environment:
      MYSQL_DATABASE: webox
      MYSQL_USER: webox
      MYSQL_PASSWORD: webox_local
      MYSQL_ROOT_PASSWORD: root_local
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - webox-mysql-data:/var/lib/mysql

volumes:
  webox-mysql-data:
